name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf fuse libfuse2 \
            libssl-dev libsqlite3-dev libp11-dev \
            libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 libx11-dev libxcb-cursor0 \
            libglib2.0-dev libdbus-1-dev libcloudproviders-dev \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev \
            librsvg2-bin

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.9.0'
          arch: linux_gcc_64
          modules: 'qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      # Ubuntu 22.04 predates KDE Frameworks 6, so KF6Archive
      # (required by src/libsync/CMakeLists.txt) and its build-time
      # dependency extra-cmake-modules aren't packaged for jammy.
      - name: Build and install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/ecm-build"
          sudo cmake --install "$RUNNER_TEMP/ecm-build"

      - name: Build and install KF6Archive
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/karchive.git "$RUNNER_TEMP/karchive"
          cmake -S "$RUNNER_TEMP/karchive" -B "$RUNNER_TEMP/karchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/karchive-build"
          sudo cmake --install "$RUNNER_TEMP/karchive-build"

      # Ubuntu 22.04 doesn't ship a Qt6 build of qtkeychain, which
      # src/CMakeLists.txt requires unless TOKEN_AUTH_ONLY is set.
      - name: Build and install qtkeychain
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/qtkeychain-build"
          sudo cmake --install "$RUNNER_TEMP/qtkeychain-build"

      # Refresh the dynamic linker cache so libKF6Archive.so.6 and
      # libqt6keychain.so (installed to /usr/local/lib above) are
      # resolvable when linuxdeploy scans the built executable's
      # shared-library dependencies later in this job.
      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF \
            -DBUILD_UPDATER=ON \
            -DMIRALL_VERSION_BUILD="${GITHUB_RUN_ID}" \
            -DMIRALL_VERSION_SUFFIX=""
          cmake --build "$GITHUB_WORKSPACE/build" --parallel "$(nproc)"
          DESTDIR="$RUNNER_TEMP/appimage-root" cmake --install "$GITHUB_WORKSPACE/build"

      - name: Deploy Qt and system dependencies with linuxdeploy
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p "$HOME/.local/linuxdeploy-tools"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          ICON_FILE="$STAGING/usr/local/share/icons/hicolor/512x512/apps/files_fm_sync.png"

          # appimagetool's strict desktop-file validation rejects custom
          # groups not prefixed "X-" (freedesktop desktop-entry spec).
          # Same workaround as admin/linux/build-appimage.sh.
          sed -i -e 's/\[org.freedesktop.CloudProviders\]/[X-org.freedesktop.CloudProviders]/' \
                 -e 's/Implements=org.freedesktop.CloudProviders/Implements=X-org.freedesktop.CloudProviders/' \
                 "$DESKTOP_FILE"

          LD_LIBRARY_PATH="$STAGING/usr/local/lib:$QT_ROOT_DIR/lib" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            --appdir="$APPDIR" \
            --executable="$STAGING/usr/local/bin/files_fm_sync" \
            --desktop-file="$DESKTOP_FILE" \
            --icon-file="$ICON_FILE"

          QMAKE="$QT_ROOT_DIR/bin/qmake" \
          QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/gui" \
          LD_LIBRARY_PATH="$STAGING/usr/local/lib:$QT_ROOT_DIR/lib:$QT_ROOT_DIR/plugins/sqldrivers" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" --appdir="$APPDIR" \
            --exclude-library="libqsqlmimer.so" \
            --exclude-library="libqtposition_nmea.so"

      - name: Assemble AppDir
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/admin/linux/appimage-launcher"
          cp "$GITHUB_WORKSPACE/admin/linux/appimage-launcher" "$APPDIR/usr/bin/launcher"
          cp "$STAGING/usr/local/bin/files_fm_synccmd" "$APPDIR/usr/bin/files_fm_synccmd"
          cp "$STAGING/usr/local/bin/files_fm_sync" "$APPDIR/usr/bin/files_fm_sync"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_sync"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_synccmd"

          ln -f -s usr/bin/launcher "$APPDIR/AppRun"
          cp "$STAGING/usr/local/share/icons/hicolor/256x256/apps/files_fm_sync.png" "$APPDIR/.DirIcon"

          mkdir -p "$APPDIR/usr/plugins"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_suffix.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_suffix.so"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_xattr.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_xattr.so"

          mkdir -p "$APPDIR/usr/share/caja-python"
          mkdir -p "$APPDIR/usr/share/nemo-python"
          mkdir -p "$APPDIR/usr/share/nautilus-python"
          cp "$STAGING/usr/local/share/caja-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/caja-python"
          cp "$STAGING/usr/local/share/nemo-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/nemo-python"
          cp "$STAGING/usr/local/share/nautilus-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/nautilus-python"

          echo "${VERSION#v}" > "$APPDIR/usr/version"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          cp --force "$DESKTOP_FILE" "$APPDIR/$(basename "$DESKTOP_FILE")"

      - name: Package AppImage with appimagetool
        env:
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          curl -sL -o "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage"

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" -n "$APPDIR" \
            "dist/files_fm_sync-${VERSION#v}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Equivalent to flatpak/flatpak-github-actions/flatpak-builder, run
      # by hand so the network-dependent step (fetching org.kde.Platform
      # from dl.flathub.org) can be retried -- that CDN has documented,
      # recurring timeout issues unrelated to this manifest. See:
      # https://github.com/flathub/flathub/issues/4993
      - name: Build Flatpak bundle
        run: |
          for attempt in 1 2 3; do
            echo "flatpak-builder attempt $attempt/3"
            if /app/bin/xvfb-run --auto-servernum flatpak-builder \
              --repo=repo \
              --disable-rofiles-fuse \
              --install-deps-from=flathub \
              --subject="Built from ${GITHUB_SHA}" \
              --force-clean \
              --default-branch=master \
              --arch=x86_64 \
              --ccache \
              --state-dir=.flatpak-builder \
              flatpak_app \
              com.files.fm.sync.nextcloud.yml; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "flatpak-builder failed after 3 attempts" >&2
              exit 1
            fi
            echo "flatpak-builder failed, retrying in 30s..."
            sleep 30
          done

          flatpak build-bundle repo files_fm_sync.flatpak \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 \
            com.files.fm.sync.nextcloud master

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak
          path: files_fm_sync.flatpak
          if-no-files-found: error

  snap:
    name: Snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    env:
      # Matches the codesign identities' CN and the SocketApi Organizational
      # Unit prefix used by the manual build script this job mirrors.
      APP_SIGN_IDENTITY: 'Apple Distribution: Files.fm SIA (QZG24DC954)'
      PKG_SIGN_IDENTITY: '3rd Party Mac Developer Installer: Files.fm SIA (QZG24DC954)'
      TEAM_IDENTIFIER_PREFIX: 'QZG24DC954.'
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # INSTALL_PREFIX/DEPS_PREFIX are set here rather than in the job-level
      # env: block above because the `runner` context (needed for
      # runner.temp) isn't available there -- only in step-level contexts.
      - name: Set up paths
        run: |
          echo "INSTALL_PREFIX=$RUNNER_TEMP/mac-install" >> "$GITHUB_ENV"
          echo "DEPS_PREFIX=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Install Homebrew build/runtime dependencies
        run: |
          brew install ninja openssl@3 libp11 sqlite3 pkg-config librsvg
          # "Packages" (s.sudre.free.fr) provides packagesutil/packagesbuild,
          # used by admin/osx/create_mac.sh to build the signed .pkg.
          brew install --cask packages
          # Optional: enables Sparkle auto-update support (BUILD_UPDATER
          # defaults ON). find_package(Sparkle) is not REQUIRED, so a
          # missing/failed install here does not fail the build.
          brew install --cask sparkle || true

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.11.1'
          modules: 'qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      # Matches the AppImage job's approach: build KDE's ECM from source
      # rather than depending on a third-party Homebrew tap being available.
      - name: Build and install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/ecm-build"
          cmake --install "$RUNNER_TEMP/ecm-build"

      - name: Build and install KF6Archive
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/karchive.git "$RUNNER_TEMP/karchive"
          cmake -S "$RUNNER_TEMP/karchive" -B "$RUNNER_TEMP/karchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX;$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/karchive-build"
          cmake --install "$RUNNER_TEMP/karchive-build"

      - name: Build and install qtkeychain
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/qtkeychain-build"
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

      # Standard GitHub Actions macOS codesigning pattern: import the
      # Distribution/Installer certificate pair into a throwaway keychain
      # that only exists for this job run. The .p12 must contain both the
      # "Apple Distribution" and "3rd Party Mac Developer Installer"
      # certificates + private keys used by sign_app.sh/create_mac.sh below.
      #
      # Requires two repo secrets, set under Settings -> Secrets and
      # variables -> Actions:
      #   MACOS_CERTIFICATE_P12       base64 of the exported .p12
      #   MACOS_CERTIFICATE_PASSWORD  export password for that .p12
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$DEPS_PREFIX;$(brew --prefix openssl@3);$(brew --prefix libp11)" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_OWNCLOUD_OSX_BUNDLE=ON \
            -DBUILD_FILE_PROVIDER_MODULE=0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSOCKETAPI_TEAM_IDENTIFIER_PREFIX="$TEAM_IDENTIFIER_PREFIX" \
            -DMIRALL_VERSION_BUILD="${GITHUB_RUN_ID}" \
            -DMIRALL_VERSION_SUFFIX=""
          cmake --build "$BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"

          chmod +x "$BUILD_DIR/admin/osx/pre_install.sh"
          "$BUILD_DIR/admin/osx/pre_install.sh"

          cmake --install "$BUILD_DIR"

          # post_install.sh registers the FinderSyncExt plugin against
          # /Applications/*.app via pluginkit -- meaningful for a live
          # end-user install, a no-op here since nothing is installed to
          # /Applications on this runner. Skipped rather than run for no
          # effect.

      - name: Sign app bundle
        run: |
          ./admin/osx/sign_app.sh "$INSTALL_PREFIX/Files.fm Sync 2025.app" \
            "$APP_SIGN_IDENTITY" "${TEAM_IDENTIFIER_PREFIX%.}"

      - name: Build and sign installer package
        run: |
          chmod +x "$BUILD_DIR/admin/osx/create_mac.sh"
          "$BUILD_DIR/admin/osx/create_mac.sh" "$INSTALL_PREFIX" "$BUILD_DIR" "$PKG_SIGN_IDENTITY"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: ${{ runner.temp }}/mac-install/*.pkg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Same KDE Craft toolchain (Qt, KF6, OpenSSL, etc. via the Nextcloud
      # blueprints) already proven by windows-build-and-test.yml's compile
      # job -- reused here rather than hand-rolling dependency installation
      # the way the AppImage/macOS jobs do, since it's a working precedent
      # already exercised on every PR in this repo.
      - name: Install Craft Master with Nextcloud Client Deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/ggadinger/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository [git]https://github.com/nextcloud/desktop-client-blueprints.git
          craft craft

          # One of the Craft blueprints (python-modules/html5lib) does a
          # `pip install html5lib`. Its setup.py still does `import
          # pkg_resources` at build time, but recent setuptools releases
          # dropped bundling pkg_resources -- and pip's isolated build venv
          # (created fresh for build-time deps) always fetches an unpinned
          # "latest" setuptools there. Neither PIP_CONSTRAINT nor
          # PIP_NO_BUILD_ISOLATION set as env vars reached that pip call --
          # Craft launches its subprocesses without inheriting this step's
          # environment. pip.ini config files are read from disk regardless
          # of how the process was launched, so use that instead: disable
          # build isolation so pip reuses Craft's own ambient Python, into
          # which a pkg_resources-compatible setuptools is pre-installed.
          # Written to both the "site" location (next to Craft's own
          # python.exe) and the per-user location, since it's not certain
          # which one Craft's embedded interpreter resolves to.
          $craftPython = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin\python.exe"
          & $craftPython -m pip install "setuptools<81" wheel

          $pipIniContent = "[install]`nno-build-isolation = true`n"
          Set-Content -Path "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin\pip.ini" -Value $pipIniContent -Encoding ascii
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\pip" | Out-Null
          Set-Content -Path "$env:APPDATA\pip\pip.ini" -Value $pipIniContent -Encoding ascii

          craft --install-deps nextcloud-client

      - name: Cache Install inkscape
        id: cache-install-inkscape
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\Program Files\inkscape
          key: ${{ runner.os }}-cache-install-inkscape

      - name: Install inkscape
        if: steps.cache-install-inkscape.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install inkscape

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir ${{ github.workspace }} nextcloud-client

      # craftmaster.ini has Packager/PackageType = NullsoftInstallerPackager
      # for this target, so --package produces an NSIS-based installer .exe.
      #
      # No signing certificate exists yet (craftmaster.ini's [Env] section
      # has CRAFT_CODESIGN_CERTIFICATE/SIGN_PACKAGE stubbed but unset), so
      # this installer ships unsigned -- it will trigger SmartScreen
      # warnings until signing is wired up. To enable it later: add a
      # [CodeSigning] section to craftmaster.ini with Enabled = True,
      # Certificate = ${Env:CRAFT_CODESIGN_CERTIFICATE}, CommonName, and
      # Protected = True, then supply CRAFT_CODESIGN_CERTIFICATE (path to a
      # decoded .pfx) and its password as job env/secrets, same pattern as
      # the macOS job's certificate import. That signer expects a standard
      # file-based .pfx + password; if the eventual cert is EV/HSM-bound
      # instead, use [CodeSigning] WindowsCustomSignCommand to shell out to
      # that provider's signing CLI instead.
      - name: Package installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --package nextcloud-client

      - name: Locate installer
        shell: pwsh
        run: |
          mkdir dist
          $installer = Get-ChildItem -Path "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" -Recurse -Include *.exe |
            Where-Object { $_.Name -match '(?i)files.?fm|nextcloud' -and $_.DirectoryName -match '(?i)tmp|packages' } |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "Could not locate a packaged installer .exe under ${{ env.CRAFT_TARGET }}"
            exit 1
          }
          Copy-Item $installer.FullName -Destination dist\

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [appimage, flatpak, snap, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          fail_on_unmatched_files: true
