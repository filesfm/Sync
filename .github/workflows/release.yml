name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:8
    env:
      QT_ROOT_DIR: /opt/qt/6.8.3/gcc_64
      # libp11 (autotools, installs to lib/) and libcloudproviders (meson,
      # installs to lib64/ on this distro) are both built from source below
      # since neither is packaged for Rocky 8/EPEL/CRB -- this makes their
      # .pc files discoverable by pkg_check_modules in the project's own
      # CMake configure step further down.
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Linux build/runtime dependencies
        run: |
          dnf install -y epel-release
          /usr/bin/crb enable
          dnf install -y \
            git tar which file findutils patchelf fuse-libs \
            python3.11 python3.11-pip gcc-toolset-13 meson \
            autoconf automake libtool pkgconf-pkg-config \
            openssl-devel sqlite-devel libsecret-devel \
            alsa-lib-devel nss libatomic \
            mesa-libGL-devel libxkbcommon libxkbcommon-x11 libX11-devel libxkbfile-devel \
            xcb-util-cursor xcb-util xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
            glib2-devel dbus-devel \
            zlib-devel bzip2-devel xz-devel libzstd-devel \
            librsvg2-tools

      # Rocky 8's default GCC (8.x) doesn't have the C++ ABI Qt 6.8's
      # official builds expect. gcc-toolset-13 gives a modern compiler
      # while every produced binary still links against Rocky 8's own
      # (old, portable) GLIBC -- that's the whole point of building on
      # Rocky 8 instead of a newer distro.
      - name: Add gcc-toolset-13 to PATH
        run: echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "$GITHUB_PATH"

      # Rocky 8's packaged cmake (3.26) is too old for current KDE Frameworks
      # (extra-cmake-modules requires 3.30+); pulling a current cmake/ninja
      # from PyPI instead of dnf avoids that mismatch entirely. Rocky 8's
      # system Python (3.6) is also too old for current aqtinstall, hence
      # python3.11 above.
      - name: Install cmake, ninja and aqtinstall via pip
        run: python3.11 -m pip install cmake ninja aqtinstall

      - name: Install Qt via aqtinstall
        run: |
          python3.11 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            -m qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning \
            -O /opt/qt
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"

      # Rocky 8 predates KDE Frameworks 6, so KF6Archive
      # (required by src/libsync/CMakeLists.txt) and its build-time
      # dependency extra-cmake-modules aren't packaged for it.
      - name: Build and install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/ecm-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/ecm-build"

      - name: Build and install KF6Archive
        run: |
          # Pinned to the newest tag whose REQUIRED_QT_VERSION (6.8.0) our
          # Qt 6.8.3 still satisfies -- tracking the default branch instead
          # breaks here once KArchive bumps past Qt 6.8.x (as of this
          # writing HEAD already requires 6.10.0).
          git clone --branch v6.24.0 --depth 1 https://invent.kde.org/frameworks/karchive.git "$RUNNER_TEMP/karchive"
          cmake -S "$RUNNER_TEMP/karchive" -B "$RUNNER_TEMP/karchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/karchive-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/karchive-build"

      # Rocky 8 doesn't ship a Qt6 build of qtkeychain, which
      # src/CMakeLists.txt requires unless TOKEN_AUTH_ONLY is set.
      - name: Build and install qtkeychain
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/qtkeychain-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

      # Rocky 8/EPEL/CRB doesn't package libp11 (CMakeLists.txt:237,
      # pkg_check_modules(OPENSC-LIBP11 libp11 REQUIRED)) at all.
      - name: Build and install libp11
        run: |
          git clone --depth 1 https://github.com/OpenSC/libp11.git "$RUNNER_TEMP/libp11"
          cd "$RUNNER_TEMP/libp11"
          ./bootstrap
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          make install

      # Rocky 8/EPEL doesn't package libcloudproviders either, but the
      # project's CMake treats it as optional (pkg_check_modules without
      # REQUIRED at CMakeLists.txt:247) -- build it so the AppImage keeps
      # the same CloudProviders desktop integration as before. Pinned to
      # 0.3.6, the last release whose glib requirement (>=2.56) Rocky 8's
      # packaged glib2-devel (2.56.4) satisfies -- every later release
      # (including the main branch) requires glib >=2.64.
      - name: Build and install libcloudproviders
        run: |
          git clone --branch 0.3.6 --depth 1 https://gitlab.gnome.org/GNOME/libcloudproviders.git "$RUNNER_TEMP/libcloudproviders"
          meson setup "$RUNNER_TEMP/libcloudproviders-build" "$RUNNER_TEMP/libcloudproviders" \
            --prefix=/usr/local \
            -Dintrospection=false \
            -Dvapigen=false
          ninja -C "$RUNNER_TEMP/libcloudproviders-build" install

      # Refresh the dynamic linker cache so libKF6Archive.so.6,
      # libqt6keychain.so and libcloudproviders.so (installed to
      # /usr/local/lib above) are resolvable when linuxdeploy scans the
      # built executable's shared-library dependencies later in this job.
      - name: Refresh dynamic linker cache
        run: ldconfig

      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF \
            -DBUILD_UPDATER=ON \
            -DMIRALL_VERSION_BUILD="${GITHUB_RUN_ID}" \
            -DMIRALL_VERSION_SUFFIX=""
          cmake --build "$GITHUB_WORKSPACE/build" --parallel "$(nproc)"
          DESTDIR="$RUNNER_TEMP/appimage-root" cmake --install "$GITHUB_WORKSPACE/build"

      - name: Deploy Qt and system dependencies with linuxdeploy
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p "$HOME/.local/linuxdeploy-tools"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          ICON_FILE="$STAGING/usr/local/share/icons/hicolor/512x512/apps/files_fm_sync.png"

          # appimagetool's strict desktop-file validation rejects custom
          # groups not prefixed "X-" (freedesktop desktop-entry spec).
          sed -i -e 's/\[org.freedesktop.CloudProviders\]/[X-org.freedesktop.CloudProviders]/' \
                 -e 's/Implements=org.freedesktop.CloudProviders/Implements=X-org.freedesktop.CloudProviders/' \
                 "$DESKTOP_FILE"

          # /usr/local/lib64 is where ECM/KArchive/qtkeychain/libp11/
          # libcloudproviders landed above (Rocky 8, like other RHEL-likes,
          # defaults cmake/autotools/meson installs on 64-bit to lib64, not
          # lib) -- linuxdeploy resolves dependencies via LD_LIBRARY_PATH,
          # not the system ldconfig cache, so it has to be listed here too.
          LD_LIBRARY_PATH="$STAGING/usr/local/lib:/usr/local/lib64:/usr/local/lib:$QT_ROOT_DIR/lib" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            --appdir="$APPDIR" \
            --executable="$STAGING/usr/local/bin/files_fm_sync" \
            --desktop-file="$DESKTOP_FILE" \
            --icon-file="$ICON_FILE"

          QMAKE="$QT_ROOT_DIR/bin/qmake" \
          QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/gui" \
          LD_LIBRARY_PATH="$STAGING/usr/local/lib:/usr/local/lib64:/usr/local/lib:$QT_ROOT_DIR/lib:$QT_ROOT_DIR/plugins/sqldrivers" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" --appdir="$APPDIR" \
            --exclude-library="libqsqlmimer.so" \
            --exclude-library="libqsqlpsql.so" \
            --exclude-library="libqsqlodbc.so" \
            --exclude-library="libqsqlmysql.so" \
            --exclude-library="libqtposition_nmea.so"

      - name: Assemble AppDir
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/admin/linux/appimage-launcher"
          cp "$GITHUB_WORKSPACE/admin/linux/appimage-launcher" "$APPDIR/usr/bin/launcher"
          cp "$STAGING/usr/local/bin/files_fm_synccmd" "$APPDIR/usr/bin/files_fm_synccmd"
          cp "$STAGING/usr/local/bin/files_fm_sync" "$APPDIR/usr/bin/files_fm_sync"
          # shellcheck disable=SC2016
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_sync"
          # shellcheck disable=SC2016
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_synccmd"

          ln -f -s usr/bin/launcher "$APPDIR/AppRun"
          cp "$STAGING/usr/local/share/icons/hicolor/256x256/apps/files_fm_sync.png" "$APPDIR/.DirIcon"

          mkdir -p "$APPDIR/usr/plugins"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_suffix.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_suffix.so"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_xattr.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_xattr.so"

          mkdir -p "$APPDIR/usr/share/caja-python"
          mkdir -p "$APPDIR/usr/share/nemo-python"
          mkdir -p "$APPDIR/usr/share/nautilus-python"
          cp "$STAGING/usr/local/share/caja-python/extensions/syncstate-Files.fm Sync 2027.py" "$APPDIR/usr/share/caja-python"
          cp "$STAGING/usr/local/share/nemo-python/extensions/syncstate-Files.fm Sync 2027.py" "$APPDIR/usr/share/nemo-python"
          cp "$STAGING/usr/local/share/nautilus-python/extensions/syncstate-Files.fm Sync 2027.py" "$APPDIR/usr/share/nautilus-python"

          echo "${VERSION#v}" > "$APPDIR/usr/version"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          cp --force "$DESKTOP_FILE" "$APPDIR/$(basename "$DESKTOP_FILE")"

      - name: Package AppImage with appimagetool
        env:
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          curl -sL -o "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage"

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" -n "$APPDIR" \
            "dist/files_fm_sync-${VERSION#v}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      # Developer ID identities for direct-download distribution (not the
      # Mac App Store identities a submission there would require).
      # Notarization (below) is what makes a Developer ID-signed pkg/dmg
      # installable without a Gatekeeper warning once downloaded.
      APP_SIGN_IDENTITY: 'Developer ID Application: Files.fm SIA (QZG24DC954)'
      PKG_SIGN_IDENTITY: 'Developer ID Installer: Files.fm SIA (QZG24DC954)'
      TEAM_IDENTIFIER_PREFIX: 'QZG24DC954.'
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # INSTALL_PREFIX/DEPS_PREFIX are set here rather than in the job-level
      # env: block above because the `runner` context (needed for
      # runner.temp) isn't available there -- only in step-level contexts.
      - name: Set up paths
        run: |
          echo "INSTALL_PREFIX=$RUNNER_TEMP/mac-install" >> "$GITHUB_ENV"
          echo "DEPS_PREFIX=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Install Homebrew build/runtime dependencies
        run: |
          brew install ninja openssl@3 libp11 sqlite3 pkg-config librsvg
          # "Packages" (s.sudre.free.fr) provides packagesutil/packagesbuild,
          # used by admin/osx/create_mac.sh to build the signed .pkg.
          brew install --cask packages
          # Optional: enables Sparkle auto-update support (BUILD_UPDATER
          # defaults ON). find_package(Sparkle) is not REQUIRED, so a
          # missing/failed install here does not fail the build.
          brew install --cask sparkle || true

          # The sparkle cask unpacks Sparkle.framework straight into its
          # Caskroom version directory (no stable, version-independent
          # symlink the way brew --prefix gives formulae), so the actual
          # path has to be discovered rather than hardcoded.
          SPARKLE_PREFIX="$(find "$(brew --prefix)/Caskroom/sparkle" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1)"
          echo "SPARKLE_PREFIX=$SPARKLE_PREFIX" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.1'
          modules: 'qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      # Matches the AppImage job's approach: build KDE's ECM from source
      # rather than depending on a third-party Homebrew tap being available.
      - name: Build and install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/ecm-build"
          cmake --install "$RUNNER_TEMP/ecm-build"

      - name: Build and install KF6Archive
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/karchive.git "$RUNNER_TEMP/karchive"
          cmake -S "$RUNNER_TEMP/karchive" -B "$RUNNER_TEMP/karchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX;$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/karchive-build"
          cmake --install "$RUNNER_TEMP/karchive-build"

      - name: Build and install qtkeychain
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build "$RUNNER_TEMP/qtkeychain-build"
          cmake --install "$RUNNER_TEMP/qtkeychain-build"

      # .p12 contains the "Developer ID Application" and "Developer ID
      # Installer" certificates + private keys -- generate them at
      # developer.apple.com -> Certificates, export both as one .p12 from
      # Keychain Access, then base64 it.
      #
      # Requires two repo secrets, set under Settings -> Secrets and
      # variables -> Actions:
      #   MACOS_DEVELOPER_ID_CERTIFICATE_P12       base64 of the exported .p12
      #   MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD  export password for that .p12
      - name: Import signing certificate
        uses: ./.github/actions/import-apple-certificate
        with:
          certificate: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$DEPS_PREFIX;$(brew --prefix openssl@3);$(brew --prefix libp11);$SPARKLE_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_OWNCLOUD_OSX_BUNDLE=ON \
            -DBUILD_FILE_PROVIDER_MODULE=0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSOCKETAPI_TEAM_IDENTIFIER_PREFIX="$TEAM_IDENTIFIER_PREFIX" \
            -DMIRALL_VERSION_BUILD="${GITHUB_RUN_ID}" \
            -DMIRALL_VERSION_SUFFIX=""
          cmake --build "$BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"

          chmod +x "$BUILD_DIR/admin/osx/pre_install.sh"
          "$BUILD_DIR/admin/osx/pre_install.sh"

          cmake --install "$BUILD_DIR"

          # post_install.sh registers the FinderSyncExt plugin against
          # /Applications/*.app via pluginkit -- meaningful for a live
          # end-user install, a no-op here since nothing is installed to
          # /Applications on this runner. Skipped rather than run for no
          # effect.

      - name: Sign app bundle
        run: |
          ./admin/osx/sign_app.sh "$INSTALL_PREFIX/Files.fm Sync 2027.app" \
            "$APP_SIGN_IDENTITY" "${TEAM_IDENTIFIER_PREFIX%.}"

      - name: Build disk image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          DMG_FILE="$INSTALL_PREFIX/files_fm_sync-${VERSION#v}.dmg"
          hdiutil create -volname "Files.fm Sync" \
            -srcfolder "$INSTALL_PREFIX/Files.fm Sync 2027.app" \
            -ov -format UDZO "$DMG_FILE"
          codesign --force --sign "$APP_SIGN_IDENTITY" --timestamp "$DMG_FILE"

      - name: Build and sign installer package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x "$BUILD_DIR/admin/osx/create_mac.sh"
          "$BUILD_DIR/admin/osx/create_mac.sh" "$INSTALL_PREFIX" "$BUILD_DIR" "$PKG_SIGN_IDENTITY"

          # create_mac.sh names the pkg after APPLICATION_SHORTNAME/Qt/Mirall
          # version, renamed here to match the dmg's naming convention.
          PKG_FILE="$(find "$INSTALL_PREFIX" -maxdepth 1 -name '*.pkg')"
          mv "$PKG_FILE" "$INSTALL_PREFIX/files_fm_sync-${VERSION#v}.pkg"

      # Gatekeeper blocks a Developer ID-signed pkg/dmg the first time it's
      # opened after being downloaded (the quarantine flag Safari/Chrome/etc
      # set on downloaded files) unless Apple has notarized it and the
      # resulting ticket is stapled to the file -- codesign/productsign
      # alone isn't sufficient for files distributed outside the App Store.
      #
      # Requires an Apple ID with an app-specific password (generated at
      # appleid.apple.com -> Sign-In and Security -> App-Specific Passwords)
      # and three repo secrets:
      #   APPLE_ID                      your Apple Developer account email
      #   APPLE_APP_SPECIFIC_PASSWORD   the generated app-specific password
      #   APPLE_TEAM_ID                 your 10-character Team ID
      - name: Notarize and staple pkg and dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for FILE in "$INSTALL_PREFIX"/*.pkg "$INSTALL_PREFIX"/*.dmg; do
            xcrun notarytool submit "$FILE" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

            xcrun stapler staple "$FILE"
            xcrun stapler validate "$FILE"

            # Simulates the Gatekeeper check macOS performs the first time a
            # user opens a file fetched from a browser download: "install"
            # for a pkg, "open" for a disk image.
            case "$FILE" in
              *.pkg) spctl -a -vv -t install "$FILE" ;;
              *.dmg) spctl -a -vv -t open --context context:primary-signature "$FILE" ;;
            esac
          done

          rm -f "$KEY_PATH"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            ${{ runner.temp }}/mac-install/*.pkg
            ${{ runner.temp }}/mac-install/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    env:
      # Staging prefix for dependencies built from source below (ECM,
      # KF6Archive, qtkeychain, libp11) -- mirrors DEPS_PREFIX in the macos
      # job further up, just at job scope since github.workspace (unlike
      # runner.temp) is available there.
      DEPS_PREFIX: ${{ github.workspace }}\deps
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      # SSL.com's own GitHub Action for eSigner (SSLcom/actions-codesigner)
      # runs as a Docker container action, which GitHub Actions can't run
      # on Windows runners -- so CodeSignTool (the underlying jsign-based
      # CLI it wraps) is fetched and run directly instead. windows-2022
      # ships a JDK (CodeSignTool's only runtime dependency) on PATH
      # already. Pinned to a specific release rather than a "latest" URL.
      - name: Install CodeSignTool
        if: false
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\CodeSignTool.zip"
          Invoke-WebRequest -Uri 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\CodeSignTool"

          $batPath = Get-ChildItem -Path "$env:RUNNER_TEMP\CodeSignTool" -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $batPath) { Write-Error "CodeSignTool.bat not found after extracting CodeSignTool"; exit 1 }
          echo "CODESIGNTOOL_DIR=$($batPath.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # windows-2022 runner images have VS2022 Build Tools but don't put
      # the compiler toolchain (cl/link/nmake/rc/mt and their INCLUDE/LIB
      # env vars) on PATH outside a "Developer Command Prompt" -- needed
      # below for libp11 (nmake) and the Ninja+cl builds of KF6Archive and
      # qtkeychain. This action writes that environment to $GITHUB_ENV so
      # it carries forward to every later step in this job.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # windows-2022 runner images ship vcpkg preinstalled at
      # $env:VCPKG_INSTALLATION_ROOT in classic (non-manifest) mode. Covers
      # OpenSSL/SQLite3/ZLIB -- required unconditionally by root
      # CMakeLists.txt's find_package(OpenSSL/SQLite3/ZLIB REQUIRED)
      # (~line 235-243), same as the apt/brew installs in the appimage and
      # macos jobs above -- plus pkgconf, needed by
      # find_package(PkgConfig REQUIRED) for libp11 below, and
      # bzip2/liblzma/zstd, which KF6Archive requires (REQUIRED packages
      # per its ecm_feature_summary output) -- same libs the appimage
      # job installs via libbz2-dev/liblzma-dev/libzstd-dev.
      - name: Install OpenSSL, SQLite3, ZLIB, BZip2, LZMA, zstd, pkgconf via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows sqlite3:x64-windows zlib:x64-windows bzip2:x64-windows liblzma:x64-windows zstd:x64-windows pkgconf:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "VCPKG_INSTALLED=$vcpkgInstalled" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # CMake's FindPkgConfig looks for an executable literally named
          # "pkg-config"; vcpkg's port only produces "pkgconf.exe". Copy it
          # under the name CMake expects instead of hardcoding a
          # version-specific host-tools path.
          $pkgconf = Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed" -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) { Write-Error "pkgconf.exe not found after vcpkg install"; exit 1 }
          Copy-Item $pkgconf.FullName (Join-Path $pkgconf.DirectoryName 'pkg-config.exe')
          echo $pkgconf.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # libp11 (github.com/OpenSC/libp11) is required unconditionally by
      # root CMakeLists.txt (pkg_check_modules(OPENSC-LIBP11 libp11
      # REQUIRED IMPORTED_TARGET), ~line 237) and included directly by
      # src/libsync/clientsideencryption*.{h,cpp} for hardware-token
      # support -- it's a real dependency on every platform, not just
      # Linux/macOS, even though it's absent from README.md's system
      # requirements list (that list predates this fork's e2e/hardware
      # token support). No vcpkg port exists for it, and its
      # Linux/macOS/Flatpak/Snap builds all use autotools (not viable here
      # without MSYS2). Upstream does ship an MSVC nmake makefile
      # (src/Makefile.mak) though, driven off OPENSSL_DIR pointing at an
      # OpenSSL install laid out as <dir>/include + <dir>/lib/libcrypto.lib
      # -- exactly vcpkg's classic install layout, so it consumes the
      # OpenSSL installed above directly. nmake's Makefile.mak doesn't
      # generate a libp11.pc (that's autotools-only, via libp11.pc.in), so
      # one is hand-written below for pkgconf to find. Version pinned to
      # match the one already used by the Flatpak/Snap builds
      # (com.files.fm.sync.yml, snap/snapcraft.yaml).
      - name: Build and install libp11 (nmake)
        shell: pwsh
        run: |
          $libp11Src = "$env:RUNNER_TEMP\libp11"
          $libp11Prefix = "$env:DEPS_PREFIX\libp11"
          git clone --depth 1 --branch libp11-0.4.20 https://github.com/OpenSC/libp11.git $libp11Src

          Push-Location "$libp11Src\src"
          nmake /nologo /f Makefile.mak BUILD_FOR=WIN64 OPENSSL_DIR="$env:VCPKG_INSTALLED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          New-Item -ItemType Directory -Force -Path "$libp11Prefix\include", "$libp11Prefix\lib\pkgconfig", "$libp11Prefix\bin" | Out-Null
          Copy-Item "$libp11Src\src\libp11.h" "$libp11Prefix\include\"
          # libp11.h includes "p11_ver.h" and "p11_err.h" (both checked
          # into src/ alongside it, not generated at build time) -- must
          # be staged too.
          Copy-Item "$libp11Src\src\p11_ver.h" "$libp11Prefix\include\"
          Copy-Item "$libp11Src\src\p11_err.h" "$libp11Prefix\include\"
          Copy-Item "$libp11Src\src\libp11.lib" "$libp11Prefix\lib\"
          Copy-Item "$libp11Src\src\libp11.dll" "$libp11Prefix\bin\"

          # CMAKE_FIND_LIBRARY_PREFIXES is empty under MSVC, so pkg-config's
          # "-l<name>" must equal the .lib's full basename (libp11, not
          # p11) for CMake's pkg_check_modules to resolve it via
          # find_library.
          $prefixForward = $libp11Prefix -replace '\\','/'
          $pcLines = @(
            "prefix=$prefixForward"
            'libdir=${prefix}/lib'
            'includedir=${prefix}/include'
            ''
            'Name: libp11'
            'Description: Library for using PKCS#11 tokens with OpenSSL'
            'Version: 0.4.20'
            'Libs: -L${libdir} -llibp11'
            'Cflags: -I${includedir}'
          )
          Set-Content -Path "$libp11Prefix\lib\pkgconfig\libp11.pc" -Value $pcLines -Encoding ascii

          echo "PKG_CONFIG_PATH=$libp11Prefix\lib\pkgconfig;$env:PKG_CONFIG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$libp11Prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Install inkscape
        id: cache-install-inkscape
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files\inkscape
          key: ${{ runner.os }}-cache-install-inkscape

      - name: Install inkscape
        if: steps.cache-install-inkscape.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install inkscape

      # Same KF6Archive/ECM source-build pattern as the appimage/macos jobs
      # above in this file. find_package(KF6Archive REQUIRED) is at
      # src/libsync/CMakeLists.txt:2 -- like libp11, it's a real dependency
      # on Windows too, despite not appearing in README.md's list.
      - name: Build and install extra-cmake-modules
        shell: pwsh
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$env:RUNNER_TEMP\ecm"
          cmake -S "$env:RUNNER_TEMP\ecm" -B "$env:RUNNER_TEMP\ecm-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX"
          cmake --build "$env:RUNNER_TEMP\ecm-build" --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install "$env:RUNNER_TEMP\ecm-build"

      - name: Build and install KF6Archive
        shell: pwsh
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/karchive.git "$env:RUNNER_TEMP\karchive"
          cmake -S "$env:RUNNER_TEMP\karchive" -B "$env:RUNNER_TEMP\karchive-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITH_QT6=ON `
            -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX;$env:VCPKG_INSTALLED;$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX"
          cmake --build "$env:RUNNER_TEMP\karchive-build" --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install "$env:RUNNER_TEMP\karchive-build"

      - name: Build and install qtkeychain
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$env:RUNNER_TEMP\qtkeychain"
          cmake -S "$env:RUNNER_TEMP\qtkeychain" -B "$env:RUNNER_TEMP\qtkeychain-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITH_QT6=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX"
          cmake --build "$env:RUNNER_TEMP\qtkeychain-build" --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install "$env:RUNNER_TEMP\qtkeychain-build"

      # ecm_add_app_icon (src/gui/CMakeLists.txt, via ECMAddAppIcon.cmake)
      # silently skips generating files_fm_sync.ico -- and embedding an
      # icon in the exe at all -- if IcoTool isn't found; it's not part
      # of Qt/vcpkg/KDE Frameworks, and windows-2022 runners don't ship
      # it. Installed via MSYS2 (preinstalled at C:\msys64 on this
      # image) since no vcpkg/choco port exists. IcoTool_EXECUTABLE is
      # passed directly to CMake below rather than adding mingw64\bin to
      # PATH, to avoid its gcc/ld shadowing the MSVC toolchain.
      - name: Install icoutils (icotool) via MSYS2
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-icoutils
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # windows-2022 runners ship WiX Toolset v3.x preinstalled but don't
      # put it on PATH or set WIX (actions/runner-images#9551). Needed
      # before configure: NCMsiHelper's CMakeLists.txt reads $ENV{WIX}.
      - name: Locate WiX Toolset
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem -Path "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixRoot) { Write-Error "WiX Toolset v3.x not found under 'C:\Program Files (x86)'"; exit 1 }

          $wixPath = "$($wixRoot.FullName)\"
          echo "WIX=$wixPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$($wixRoot.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # BUILD_WIN_MSI=ON also pulls in admin/win/tools (NCMsiHelper) and
      # shell_integration/windows, which install their WiX sources/DLL
      # into <install-prefix>\msi\ alongside admin/win/msi's own files.
      #
      # ecm_add_app_icon (which generates files_fm_sync.ico) reads
      # ECM_FIND_MODULE_DIR to locate KDE ECM's own FindIcoTool.cmake
      # (cmake/modules/ECMAddAppIcon.cmake:203). That variable is only
      # ever set as a side effect of find_package(ECM), which this repo
      # calls solely from shell_integration/dolphin/CMakeLists.txt -- a
      # Linux-only subdirectory never processed on Windows. So on
      # Windows ECM_FIND_MODULE_DIR is simply never set, the lookup
      # falls through to CMake's own unrelated built-in
      # Modules/FindIcotool.cmake (shipped since CMake 3.3), and on
      # Windows' case-insensitive filesystem that resolves successfully
      # by filename collision -- but sets Icotool_FOUND (CMake's own
      # module's casing), not the IcoTool_FOUND ecm_add_app_icon
      # actually checks, so the icon is silently never generated. Set
      # ECM_FIND_MODULE_DIR explicitly so the real module is found.
      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE\build" -G Ninja `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX;$env:VCPKG_INSTALLED;$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DBUILD_WIN_MSI=ON `
            -DECM_FIND_MODULE_DIR="$env:DEPS_PREFIX\share\ECM\find-modules" `
            -DIcoTool_EXECUTABLE="C:\msys64\mingw64\bin\icotool.exe" `
            -DMIRALL_VERSION_BUILD="$env:GITHUB_RUN_NUMBER" `
            -DMIRALL_VERSION_SUFFIX=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build "$env:GITHUB_WORKSPACE\build" --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --install "$env:GITHUB_WORKSPACE\build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # windeployqt (next step) only deploys Qt's own binaries -- these
      # DEPS_PREFIX (libp11/KF6Archive/qtkeychain) and vcpkg
      # (OpenSSL/zlib/bzip2/liblzma/zstd, all shared libs in vcpkg's
      # default triplet) DLLs are ordinary runtime dependencies it doesn't
      # know about and never copies. windeployqt also misclassifies
      # qt6keychain.dll as a Qt library (matches its "qt6*" naming
      # heuristic) and unconditionally tries to source it from
      # $env:QT_ROOT_DIR\bin, failing outright if it's not there -- so a
      # copy has to be planted there first.
      - name: Stage third-party runtime DLLs
        shell: pwsh
        run: |
          $qtkeychainDll = "$env:DEPS_PREFIX\bin\qt6keychain.dll"
          if (-not (Test-Path $qtkeychainDll)) { Write-Error "qt6keychain.dll not found under DEPS_PREFIX\bin"; exit 1 }
          Copy-Item $qtkeychainDll "$env:QT_ROOT_DIR\bin\qt6keychain.dll"

          Get-ChildItem -Path "$env:DEPS_PREFIX" -Recurse -Filter "*.dll" | Copy-Item -Destination "$env:GITHUB_WORKSPACE\install\bin"
          Get-ChildItem -Path "$env:VCPKG_INSTALLED\bin" -Filter "*.dll" | Copy-Item -Destination "$env:GITHUB_WORKSPACE\install\bin"

      # Nothing in this project's CMake stages Qt's runtime DLLs/plugins
      # next to the exe -- without this the MSI would install an app that
      # can't start. --qmldir is required (matches the macOS job's
      # -qmldir=... to macdeployqt and the AppImage job's QML_SOURCES_PATHS)
      # so windeployqt scans the app's QML imports and deploys the
      # QtQuick/QtQuick.Controls2 QML plugins -- without it, no qml
      # directory is staged and the QML-based tray window fails to load.
      - name: Deploy Qt runtime with windeployqt
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --qmldir "$env:GITHUB_WORKSPACE\src\gui" "$env:GITHUB_WORKSPACE\install\bin\files_fm_sync.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signed before WiX harvests install\bin (next steps) so the exe
      # packaged inside the MSI -- and the one copied into the portable
      # zip further down -- are both already signed. -output_dir_path is
      # a scratch dir rather than the exe's own directory, to avoid
      # relying on undocumented in-place-overwrite confirmation behavior.
      - name: Sign application executable
        if: false
        shell: pwsh
        env:
          SSLCOM_CREDENTIAL_ID: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
          SSLCOM_PASSWORD: ${{ secrets.SSLCOM_PASSWORD }}
          SSLCOM_TOTP_SECRET: ${{ secrets.SSLCOM_TOTP_SECRET }}
        run: |
          $exe = "$env:GITHUB_WORKSPACE\install\bin\files_fm_sync.exe"
          $signedDir = "$env:RUNNER_TEMP\signed-exe"
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null

          Push-Location "$env:CODESIGNTOOL_DIR"
          try {
            .\CodeSignTool.bat sign `
              -credential_id="$env:SSLCOM_CREDENTIAL_ID" `
              -username="$env:SSLCOM_USERNAME" `
              -password="$env:SSLCOM_PASSWORD" `
              -totp_secret="$env:SSLCOM_TOTP_SECRET" `
              -input_file_path="$exe" `
              -output_dir_path="$signedDir"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          Copy-Item (Join-Path $signedDir "files_fm_sync.exe") $exe -Force

      # Nextcloud.wxs expects files_fm_sync.ico next to the exe (for
      # Start Menu/Desktop shortcuts), but the .ico that ecm_add_app_icon
      # generates for the RC resource is never installed as a loose file.
      - name: Stage app icon for WiX
        shell: pwsh
        run: |
          $icon = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build" -Recurse -Filter "files_fm_sync.ico" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $icon) { Write-Error "files_fm_sync.ico not found under the build tree"; exit 1 }
          Copy-Item $icon.FullName "$env:GITHUB_WORKSPACE\install\bin\files_fm_sync.ico"

      # make-msi.bat references its WiX sources by relative path, so it
      # must run from install\msi.
      - name: Build MSI installer with WiX
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\install\msi"
          cmd /c make-msi.bat "$env:GITHUB_WORKSPACE\install\bin"
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }

      # WiX names the .msi after APPLICATION_SHORTNAME and the internal
      # build-numbered version (e.g. "Files.fm Sync 2027-3.16.7.142-x64.msi")
      # -- renamed here to match every other release asset's
      # files_fm_sync-<tag> naming convention. No arch suffix: this
      # workflow only ever produces one Windows build.
      - name: Locate installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist | Out-Null
          $installer = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\install\msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $installer) { Write-Error "Could not locate a packaged .msi under install\msi"; exit 1 }
          $version = $env:VERSION -replace '^v',''
          Copy-Item $installer.FullName -Destination "dist\files_fm_sync-$version.msi"

      # Signs the MSI package itself -- separate from signing the exe
      # inside it above, since Windows checks the installer package's
      # own Authenticode signature too (e.g. for SmartScreen reputation).
      - name: Sign MSI installer
        if: false
        shell: pwsh
        env:
          SSLCOM_CREDENTIAL_ID: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
          SSLCOM_PASSWORD: ${{ secrets.SSLCOM_PASSWORD }}
          SSLCOM_TOTP_SECRET: ${{ secrets.SSLCOM_TOTP_SECRET }}
        run: |
          $msi = Get-ChildItem -Path dist -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "Could not locate a .msi under dist\ to sign"; exit 1 }

          $signedDir = "$env:RUNNER_TEMP\signed-msi"
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null

          Push-Location "$env:CODESIGNTOOL_DIR"
          try {
            .\CodeSignTool.bat sign `
              -credential_id="$env:SSLCOM_CREDENTIAL_ID" `
              -username="$env:SSLCOM_USERNAME" `
              -password="$env:SSLCOM_PASSWORD" `
              -totp_secret="$env:SSLCOM_TOTP_SECRET" `
              -input_file_path="$($msi.FullName)" `
              -output_dir_path="$signedDir"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          Copy-Item (Join-Path $signedDir $msi.Name) $msi.FullName -Force

      # Portable zip of the same install\bin tree the MSI installs --
      # windeployqt + the DLL-staging step above have already fully
      # populated it with Qt's runtime plus every third-party DLL.
      - name: Build portable zip
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^v',''
          $packageDir = "files_fm_sync-$version"
          Copy-Item "$env:GITHUB_WORKSPACE\install\bin" "$env:GITHUB_WORKSPACE\$packageDir" -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\COPYING" "$env:GITHUB_WORKSPACE\$packageDir\"
          7z a -tzip "dist\files_fm_sync-$version.zip" "$env:GITHUB_WORKSPACE\$packageDir"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [appimage, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          fail_on_unmatched_files: true
