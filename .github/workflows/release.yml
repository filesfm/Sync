name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf fuse libfuse2 \
            libssl-dev libsqlite3-dev libp11-dev \
            libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 libx11-dev libxcb-cursor0 \
            libglib2.0-dev libdbus-1-dev libcloudproviders-dev \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev \
            librsvg2-bin

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.9.0'
          arch: linux_gcc_64
          modules: 'qt5compat qtwebsockets qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      # Ubuntu 22.04 predates KDE Frameworks 6, so KF6Archive
      # (required by src/libsync/CMakeLists.txt) and its build-time
      # dependency extra-cmake-modules aren't packaged for jammy.
      - name: Build and install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/ecm-build"
          sudo cmake --install "$RUNNER_TEMP/ecm-build"

      - name: Build and install KF6Archive
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/karchive.git "$RUNNER_TEMP/karchive"
          cmake -S "$RUNNER_TEMP/karchive" -B "$RUNNER_TEMP/karchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/karchive-build"
          sudo cmake --install "$RUNNER_TEMP/karchive-build"

      # Ubuntu 22.04 doesn't ship a Qt6 build of qtkeychain, which
      # src/CMakeLists.txt requires unless TOKEN_AUTH_ONLY is set.
      - name: Build and install qtkeychain
        run: |
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/qtkeychain-build"
          sudo cmake --install "$RUNNER_TEMP/qtkeychain-build"

      # Refresh the dynamic linker cache so libKF6Archive.so.6 and
      # libqt6keychain.so (installed to /usr/local/lib above) are
      # resolvable when linuxdeploy scans the built executable's
      # shared-library dependencies later in this job.
      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Configure, compile and install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF \
            -DBUILD_UPDATER=ON \
            -DMIRALL_VERSION_BUILD="${GITHUB_RUN_ID}" \
            -DMIRALL_VERSION_SUFFIX=""
          cmake --build "$GITHUB_WORKSPACE/build" --parallel "$(nproc)"
          DESTDIR="$RUNNER_TEMP/appimage-root" cmake --install "$GITHUB_WORKSPACE/build"

      - name: Deploy Qt and system dependencies with linuxdeploy
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p "$HOME/.local/linuxdeploy-tools"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          ICON_FILE="$STAGING/usr/local/share/icons/hicolor/512x512/apps/files_fm_sync.png"

          # appimagetool's strict desktop-file validation rejects custom
          # groups not prefixed "X-" (freedesktop desktop-entry spec).
          # Same workaround as admin/linux/build-appimage.sh.
          sed -i -e 's/\[org.freedesktop.CloudProviders\]/[X-org.freedesktop.CloudProviders]/' \
                 -e 's/Implements=org.freedesktop.CloudProviders/Implements=X-org.freedesktop.CloudProviders/' \
                 "$DESKTOP_FILE"

          LD_LIBRARY_PATH="$STAGING/usr/local/lib:$QT_ROOT_DIR/lib" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" \
            --appdir="$APPDIR" \
            --executable="$STAGING/usr/local/bin/files_fm_sync" \
            --desktop-file="$DESKTOP_FILE" \
            --icon-file="$ICON_FILE"

          QMAKE="$QT_ROOT_DIR/bin/qmake" \
          QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/gui" \
          LD_LIBRARY_PATH="$STAGING/usr/local/lib:$QT_ROOT_DIR/lib:$QT_ROOT_DIR/plugins/sqldrivers" \
            "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" --appdir="$APPDIR" \
            --exclude-library="libqsqlmimer.so" \
            --exclude-library="libqtposition_nmea.so"

      - name: Assemble AppDir
        env:
          STAGING: ${{ runner.temp }}/appimage-root
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/admin/linux/appimage-launcher"
          cp "$GITHUB_WORKSPACE/admin/linux/appimage-launcher" "$APPDIR/usr/bin/launcher"
          cp "$STAGING/usr/local/bin/files_fm_synccmd" "$APPDIR/usr/bin/files_fm_synccmd"
          cp "$STAGING/usr/local/bin/files_fm_sync" "$APPDIR/usr/bin/files_fm_sync"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_sync"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/files_fm_synccmd"

          ln -f -s usr/bin/launcher "$APPDIR/AppRun"
          cp "$STAGING/usr/local/share/icons/hicolor/256x256/apps/files_fm_sync.png" "$APPDIR/.DirIcon"

          mkdir -p "$APPDIR/usr/plugins"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_suffix.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_suffix.so"
          cp "$(find "$STAGING" -name 'files_fm_syncsync_vfs_xattr.so')" "$APPDIR/usr/plugins/files_fm_syncsync_vfs_xattr.so"

          mkdir -p "$APPDIR/usr/share/caja-python"
          mkdir -p "$APPDIR/usr/share/nemo-python"
          mkdir -p "$APPDIR/usr/share/nautilus-python"
          cp "$STAGING/usr/local/share/caja-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/caja-python"
          cp "$STAGING/usr/local/share/nemo-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/nemo-python"
          cp "$STAGING/usr/local/share/nautilus-python/extensions/syncstate-Files.fm Sync 2025.py" "$APPDIR/usr/share/nautilus-python"

          echo "${VERSION#v}" > "$APPDIR/usr/version"

          DESKTOP_FILE="$(find "$STAGING/usr/local/share/applications" -name '*.desktop' | head -n1)"
          cp --force "$DESKTOP_FILE" "$APPDIR/$(basename "$DESKTOP_FILE")"

      - name: Package AppImage with appimagetool
        env:
          APPDIR: ${{ runner.temp }}/AppDir
          VERSION: ${{ github.ref_name }}
        run: |
          curl -sL -o "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage"

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 "$HOME/.local/linuxdeploy-tools/appimagetool.AppImage" -n "$APPDIR" \
            "dist/files_fm_sync-${VERSION#v}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Equivalent to flatpak/flatpak-github-actions/flatpak-builder, run
      # by hand so the network-dependent step (fetching org.kde.Platform
      # from dl.flathub.org) can be retried -- that CDN has documented,
      # recurring timeout issues unrelated to this manifest. See:
      # https://github.com/flathub/flathub/issues/4993
      - name: Build Flatpak bundle
        run: |
          for attempt in 1 2 3; do
            echo "flatpak-builder attempt $attempt/3"
            if /app/bin/xvfb-run --auto-servernum flatpak-builder \
              --repo=repo \
              --disable-rofiles-fuse \
              --install-deps-from=flathub \
              --subject="Built from ${GITHUB_SHA}" \
              --force-clean \
              --default-branch=master \
              --arch=x86_64 \
              --ccache \
              --state-dir=.flatpak-builder \
              flatpak_app \
              com.files.fm.sync.nextcloud.yml; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "flatpak-builder failed after 3 attempts" >&2
              exit 1
            fi
            echo "flatpak-builder failed, retrying in 30s..."
            sleep 30
          done

          flatpak build-bundle repo files_fm_sync.flatpak \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 \
            com.files.fm.sync.nextcloud master

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak
          path: files_fm_sync.flatpak
          if-no-files-found: error

  snap:
    name: Snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [appimage, flatpak, snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          fail_on_unmatched_files: true
