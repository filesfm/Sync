# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/install-qt"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/import-apple-certificate"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/download-release-asset"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
